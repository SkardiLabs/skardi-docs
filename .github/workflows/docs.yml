name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one docs deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The current docs version is generated from the skardi repo, so the
      # build needs README + docs/ + demo/ + asset/, not just the README.
      # Cone mode also brings the root files, README.md among them.
      - name: Check out skardi (docs source)
        uses: actions/checkout@v4
        with:
          repository: SkardiLabs/skardi
          path: skardi-src
          sparse-checkout: |
            docs
            demo
            asset

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install Docusaurus dependencies
        run: npm ci
        working-directory: website

      - name: Build Docusaurus site
        run: npm run build
        working-directory: website
        env:
          SKARDI_ROOT: ${{ github.workspace }}/skardi-src

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
